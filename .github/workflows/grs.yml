name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

concurrency:
  group: update-readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate stats card (dark mode)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            {
              "username": "${{ github.repository_owner }}",
              "show_icons": true,
              "include_all_commits": true,
              "exclude_repo": "github-readme-stats",
              "role": "OWNER,COLLABORATOR",
              "line_height": 25,
              "card_width": 420,
              "theme": "bear",
              "hide_border": true,
              "show": "reviews,discussions_started,discussions_answered",
              "rank_icon": "percentile"
            }
          path: profile/stats-dark-mode.svg
          token: ${{ secrets.README_STATS_TOKEN }}

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            {
              "username": "${{ github.repository_owner }}",
              "show_icons": true,
              "include_all_commits": true,
              "exclude_repo": "github-readme-stats",
              "role": "OWNER,COLLABORATOR",
              "line_height": 25,
              "card_width": 420,
              "theme": "default",
              "hide_border": true,
              "show": "reviews,discussions_started,discussions_answered",
              "rank_icon": "percentile"
            }
          path: profile/stats.svg
          token: ${{ secrets.README_STATS_TOKEN }}

      - name: Generate top languages card (dark mode)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            {
              "username": "${{ github.repository_owner }}",
              "count_private": true,
              "langs_count": 12,
              "role": "OWNER,COLLABORATOR",
              "layout": "compact",
              "size_weight": 0.4,
              "count_weight": 0.6,
              "hide_border": true,
              "theme": "bear"
            }
          path: profile/top-langs-dark-mode.svg
          token: ${{ secrets.README_STATS_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            {
              "username": "${{ github.repository_owner }}",
              "count_private": true,
              "langs_count": 12,
              "role": "OWNER,COLLABORATOR",
              "layout": "compact",
              "size_weight": 0.4,
              "count_weight": 0.6,
              "hide_border": true,
              "theme": "default"
            }
          path: profile/top-langs.svg
          token: ${{ secrets.README_STATS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --staged --quiet; then
            echo "No card changes"
            exit 0
          fi
          git commit -m "Update README cards"
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            if git rebase "origin/$branch"; then
              git push origin "HEAD:$branch" && exit 0
            else
              # Fresh SVGs in this commit should win over an older card commit.
              git checkout --theirs -- profile/*.svg
              git add profile/*.svg
              GIT_EDITOR=true git rebase --continue
              git push origin "HEAD:$branch" && exit 0
            fi
            echo "Push rejected, retry ${attempt}"
            sleep $((attempt * 2))
          done
          exit 1
